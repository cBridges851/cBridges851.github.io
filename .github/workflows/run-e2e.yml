name: Run E2E

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master

permissions:
  contents: read

env:
  PROJECT_PATH: MyCorner/MyCorner.csproj
  DOTNET_VERSION: 8.0.x
  PUBLISH_DIR: publish

jobs:
  run-e2e:
    name: Run E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Publish Blazor WASM (Release)
        run: dotnet publish MyCorner -c Release

      - name: Fix Blazor WASM integrity hash
        run: |
          node -e "const fs=require('fs'),crypto=require('crypto');const bootPath='MyCorner/bin/Release/net8.0/publish/wwwroot/_framework/blazor.boot.json';const boot=JSON.parse(fs.readFileSync(bootPath,'utf8'));const wasmPath='MyCorner/bin/Release/net8.0/publish/wwwroot/_framework/dotnet.native.wasm';const hash=crypto.createHash('sha256').update(fs.readFileSync(wasmPath)).digest('base64');boot.resources.wasmNative['dotnet.native.wasm']='sha256-'+hash;fs.writeFileSync(bootPath,JSON.stringify(boot));console.log('patched wasmNative hash to',boot.resources.wasmNative['dotnet.native.wasm']);"
      
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci
        working-directory: tests/e2e
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: tests/e2e
        
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: tests/e2e
        
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
