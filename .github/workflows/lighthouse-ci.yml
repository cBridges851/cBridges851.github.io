name: Lighthouse CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_PATH: MyCorner/MyCorner.csproj
  DOTNET_VERSION: 8.0.x
  PUBLISH_DIR: publish

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Publish Blazor WASM (Release)
        run: dotnet publish MyCorner -c Release

      # Workaround for a .NET 8 SDK bug: the SRI hash recorded for dotnet.native.wasm in
      # blazor.boot.json is stale and does not match the published file, which causes
      # Chrome to block the wasm and prevents Blazor from loading. Recompute the hash
      # from the actual file so the integrity check passes.
      - name: Fix Blazor WASM integrity hash
        run: |
          node -e "
          const fs=require('fs'),crypto=require('crypto');
          const bootPath='MyCorner/bin/Release/net8.0/publish/wwwroot/_framework/blazor.boot.json';
          const boot=JSON.parse(fs.readFileSync(bootPath,'utf8'));
          const wasmPath='MyCorner/bin/Release/net8.0/publish/wwwroot/_framework/dotnet.native.wasm';
          const hash=crypto.createHash('sha256').update(fs.readFileSync(wasmPath)).digest('base64');
          boot.resources.wasmNative['dotnet.native.wasm']='sha256-'+hash;
          fs.writeFileSync(bootPath,JSON.stringify(boot));
          console.log('patched wasmNative hash to',boot.resources.wasmNative['dotnet.native.wasm']);
          "

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: >
          lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore