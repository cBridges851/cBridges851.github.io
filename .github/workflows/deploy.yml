name: Deploy static content to GitHub Pages
env:
  PUBLISH_DIR: MyCorner/bin/Release/net8.0/publish/wwwroot

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v3.4.2
        with:
          dotnet-version: '8.0'

      - name: Publish
        run: dotnet publish MyCorner -c Release

      - name: Fix Blazor WASM integrity hash
        run: |
          node -e "
          const fs=require('fs'),crypto=require('crypto');
          const bootPath='MyCorner/bin/Release/net8.0/publish/wwwroot/_framework/blazor.boot.json';
          const boot=JSON.parse(fs.readFileSync(bootPath,'utf8'));
          const wasmPath='MyCorner/bin/Release/net8.0/publish/wwwroot/_framework/dotnet.native.wasm';
          const hash=crypto.createHash('sha256').update(fs.readFileSync(wasmPath)).digest('base64');
          boot.resources.wasmNative['dotnet.native.wasm']='sha256-'+hash;
          fs.writeFileSync(bootPath,JSON.stringify(boot));
          console.log('patched wasmNative hash to',boot.resources.wasmNative['dotnet.native.wasm']);
          "

      - name: List output files
        run: ls -alhR ${{ env.PUBLISH_DIR }}

      - name: Verify index.html exists
        run: |
            if [ ! -f "${{ env.PUBLISH_DIR }}/index.html" ]; then
              echo "index.html not found! Failing."
              exit 1
            fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4.0.5